name: CI

# covers: simd_json.native_build_and_abi.official_vendored_source simd_json.native_build_and_abi.pinned_toolchain simd_json.native_build_and_abi.clean_checkout_build simd_json.native_build_and_abi.target_qualification simd_json.native_build_and_abi.clean_supported_build simd_json.native_build_and_abi.unsupported_target_rejection simd_json.native_build_and_abi.c_abi_conformance simd_json.native_build_and_abi.cpp_exception_translation simd_json.native_build_and_abi.release_symbol_surface simd_json.document_resource.padded_owned_copy simd_json.document_resource.zero_copy_disabled simd_json.document_resource.lifecycle simd_json.document_resource.reverse_destruction simd_json.document_resource.test_accounting simd_json.document_resource.input_lifetime simd_json.document_resource.partial_open_failure

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-baseline:
    name: Native baseline (x86_64 Linux)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      ZIGLER_RELEASE_MODE: safe
      SIMD_JSON_SPEC_BASE: origin/main

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install the qualified BEAM toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Restore ABI-keyed build inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
            ~/.cache/zigler
          key: >-
            native-${{ runner.os }}-x86_64-${{ env.MIX_ENV }}-${{ env.ZIGLER_RELEASE_MODE }}-${{ hashFiles('.tool-versions', 'mix.exs', 'mix.lock', 'lib/simd_json/native/**', 'native/**') }}

      - name: Install Mix tooling and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix zig.get --version 0.16.0

      - name: Verify the official simdjson archive
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/simdjson/simdjson/releases/download/v4.6.9/singleheader.zip \
            --output "${RUNNER_TEMP}/simdjson-singleheader.zip"
          mix simd_json.verify_vendor --archive "${RUNNER_TEMP}/simdjson-singleheader.zip"

      - name: Verify and compile repository-native sources
        run: |
          mix simd_json.verify_vendor
          mix compile --force

      - name: Qualify the complete Milestone 3 release candidate
        run: bash scripts/ci/qualify_milestone_3.sh

      - name: Qualify the Milestone 4 native pool
        run: bash scripts/ci/qualify_native_pool.sh

      - name: Archive Milestone 3 acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone-3-acceptance-${{ github.sha }}
          path: _build/qualification
          if-no-files-found: error
          retention-days: 30
